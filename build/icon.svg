<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af0"/>
      <stop offset="100%" style="stop-color:#5a4bd4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8c42"/>
      <stop offset="100%" style="stop-color:#f06040"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <!-- Anvil shape - stylized -->
  <g transform="translate(512, 480)">
    <!-- Anvil body -->
    <path d="M-220,60 L-180,-80 C-160,-120 -100,-140 0,-140 C100,-140 160,-120 180,-80 L220,60 L260,60 C280,60 280,100 260,100 L-260,100 C-280,100 -280,60 -260,60 Z" fill="white" opacity="0.95"/>
    <!-- Anvil horn (left point) -->
    <path d="M-220,60 L-300,30 C-320,24 -320,60 -300,66 L-220,80 Z" fill="white" opacity="0.95"/>
    <!-- Anvil base -->
    <rect x="-160" y="100" width="320" height="40" rx="8" fill="white" opacity="0.85"/>
    <rect x="-120" y="140" width="240" height="50" rx="10" fill="white" opacity="0.75"/>
    <!-- Hammer -->
    <g transform="rotate(-35, 80, -200)">
      <!-- Hammer handle -->
      <rect x="75" y="-320" width="12" height="200" rx="6" fill="url(#glow)" opacity="0.9"/>
      <!-- Hammer head -->
      <rect x="45" y="-340" width="72" height="36" rx="6" fill="url(#glow)"/>
    </g>
    <!-- Sparks -->
    <circle cx="-30" cy="-160" r="6" fill="#ffcc44" opacity="0.9"/>
    <circle cx="30" cy="-180" r="4" fill="#ffcc44" opacity="0.8"/>
    <circle cx="-60" cy="-175" r="3" fill="#ffcc44" opacity="0.7"/>
    <circle cx="60" cy="-165" r="5" fill="#ffaa33" opacity="0.85"/>
    <circle cx="0" cy="-195" r="3.5" fill="#ffcc44" opacity="0.75"/>
  </g>
  <!-- Subtle "F" letterform hint at bottom -->
</svg>
